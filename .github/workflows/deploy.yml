name: Deploy to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.BACKEND_IMAGE_NAME }}
          provenance: true
          sbom: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./front
          push: true
          tags: ${{ vars.FRONTEND_IMAGE_NAME }}
          provenance: true
          sbom: true

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "BACKEND_IMAGE_NAME=${{ vars.BACKEND_IMAGE_NAME }}" > .env
            echo "FRONTEND_IMAGE_NAME=${{ vars.FRONTEND_IMAGE_NAME }}" >> .env
            echo "DB_URL=sqlite:///./data/albertpoke.db" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            echo "ALTCHA_HMAC_KEY=${{ secrets.ALTCHA_HMAC_KEY }}" >> .env
            echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .env
            echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> .env
            echo "VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}" >> .env

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f
