services:
  backend:
    image: ${BACKEND_IMAGE_NAME}
    env_file: .env
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE_NAME}
    ports:
      - "127.0.0.1:2137:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
