[project]
name = "albertpoke"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "altcha>=2.1.0",
    "anyio>=4.14.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "pywebpush>=2.4.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.Security"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
